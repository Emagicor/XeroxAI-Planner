server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_UPLOAD_MB (50) plus multipart overhead.
    client_max_body_size 55m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell, or clients pin to a stale asset manifest after redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /analyze/stream is SSE: pass events straight through, and allow long
        # gaps between them (one vision pass on a 300-DPI page can exceed 60s).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
